<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XO Ultra</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
  
  :root {
    --primary: #6366f1;
    --primary-dark: #4f46e5;
    --secondary: #ec4899;
    --secondary-dark: #db2777;
    --bg: #0f172a;
    --bg-light: #1e293b;
    --text: #f1f5f9;
    --text-dim: #94a3b8;
    --grid: #334155;
    --success: #22c55e;
    --danger: #ef4444;
    --warning: #f59e0b;
  }

  * {
    font-family: 'Poppins', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
  }

  .gradient-text {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .glass {
    background: rgba(30, 41, 59, 0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .cell {
    aspect-ratio: 1;
    background: var(--bg-light);
    border: 2px solid var(--grid);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    cursor: pointer;
  }

  .cell:hover:not(.disabled) {
    background: rgba(99, 102, 241, 0.1);
    border-color: var(--primary);
    transform: scale(1.05);
    box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
  }

  .cell.disabled {
    cursor: not-allowed;
  }

  .cell.winner {
    animation: pulse-win 0.6s ease-in-out 3;
    background: rgba(34, 197, 94, 0.2);
    border-color: var(--success);
  }

  @keyframes pulse-win {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); box-shadow: 0 0 30px rgba(34, 197, 94, 0.6); }
  }

  .xo-svg {
    width: 70%;
    height: 70%;
    opacity: 0;
    transform: scale(0);
    animation: pop-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  @keyframes pop-in {
    to {
      opacity: 1;
      transform: scale(1);
    }
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 25px rgba(99, 102, 241, 0.6);
  }

  .btn-secondary {
    background: linear-gradient(135deg, var(--secondary), var(--secondary-dark));
    box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
  }

  .btn-secondary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 25px rgba(236, 72, 153, 0.6);
  }

  .toggle-switch {
    position: relative;
    width: 60px;
    height: 30px;
  }

  .toggle-switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }

  .toggle-slider {
    position: absolute;
    cursor: pointer;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--grid);
    transition: 0.4s;
    border-radius: 30px;
  }

  .toggle-slider:before {
    position: absolute;
    content: "";
    height: 22px;
    width: 22px;
    left: 4px;
    bottom: 4px;
    background: white;
    transition: 0.4s;
    border-radius: 50%;
  }

  input:checked + .toggle-slider {
    background: var(--primary);
  }

  input:checked + .toggle-slider:before {
    transform: translateX(30px);
  }

  .difficulty-btn {
    transition: all 0.3s ease;
    border: 2px solid transparent;
  }

  .difficulty-btn.active {
    border-color: var(--primary);
    background: rgba(99, 102, 241, 0.2);
    transform: scale(1.05);
  }

  .modal {
    animation: modal-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes modal-in {
    from {
      opacity: 0;
      transform: scale(0.8) translateY(-20px);
    }
    to {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
  }

  .intro-screen {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: fade-out 0.5s ease 2s forwards;
  }

  @keyframes fade-out {
    to {
      opacity: 0;
      visibility: hidden;
    }
  }

  .intro-logo {
    animation: intro-pop 1.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes intro-pop {
    0% { transform: scale(0) rotate(-180deg); opacity: 0; }
    50% { transform: scale(1.2) rotate(10deg); }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  .score-card {
    transition: all 0.3s ease;
  }

  .score-card.active {
    background: rgba(99, 102, 241, 0.2);
    border-color: var(--primary);
    transform: scale(1.05);
  }

  .confetti {
    position: fixed;
    width: 10px;
    height: 10px;
    background: var(--primary);
    pointer-events: none;
    z-index: 9998;
  }

  @media (max-width: 640px) {
    .cell {
      border-width: 1px;
    }
  }

  .lang-toggle {
    transition: all 0.3s ease;
  }

  .lang-toggle.active {
    background: var(--primary);
    color: white;
  }
</style>
